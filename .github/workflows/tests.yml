name: tests

# The tests that need no game install: codecs, writers on made-up data, the command line, the MCP server, the scaffold.
# Everything that compares against the game's own files (sdk/selftest.py, `bl compat`) needs an install and runs locally.
on:
  push:
  pull_request:

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: python tests/run_offline.py
